# Equanimous render — GitHub Actions port of the local FFmpeg bridge.
#
# Triggered by n8n via workflow_dispatch. The runner installs ffmpeg, the
# Montserrat ExtraBold font and faster-whisper, runs render.py in the
# requested mode, and uploads the finished MP4 as a workflow artifact
# named after the video_id.
#
# Inputs:
#   mode          - assemble (n8n W05) or captions (n8n W06)
#   video_id      - e.g. EQ-1794202623342-2; also the artifact name
#   manifest_json - JSON string: media list, narration, script, ambience.
#                   Media items may be {"drive": "<file-id>", "ext": ...}
#                   (Drive file IDs — the files are private, so the
#                   runner reads them with the service account key).
#   drive_folder  - Drive folder ID the finished video is uploaded to
#                   (the videos folder). The runner creates a subfolder
#                   named by the video's YouTube title inside it.
#
# Secrets (set in the repo settings, never in code):
#   GOOGLE_SERVICE_ACCOUNT_KEY - the service account JSON key. The
#     workflow writes it to service-account.json and passes it to
#     render.py as --drive-key. The runner uses it to read Drive inputs
#     and upload the finished video.

name: Equanimous render

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Render mode: assemble (W05) or captions (W06)"
        required: true
        type: choice
        options:
          - assemble
          - captions
      video_id:
        description: "Video id, e.g. EQ-1794202623342-2 (also the artifact name)"
        required: true
        type: string
      manifest_json:
        description: "Manifest JSON: media list, narration reference, script and ambience"
        required: true
        type: string
      drive_folder:
        description: "Drive folder ID the finished video is uploaded to (the videos folder; the runner creates a subfolder named by the video's YouTube title inside it)"
        required: false
        type: string
        default: "1OmX7HXuEVwXiBOR5Qi37z3jEVwr2AT2R"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install ffmpeg and Montserrat font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fontconfig curl
          sudo mkdir -p /usr/share/fonts/truetype/montserrat
          sudo curl -fsSL -o /usr/share/fonts/truetype/montserrat/Montserrat-ExtraBold.ttf \
            https://raw.githubusercontent.com/googlefonts/Montserrat/master/fonts/ttf/Montserrat-ExtraBold.ttf
          sudo fc-cache -f
          ffmpeg -version | head -1
          fc-list | grep -i montserrat | head -2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install faster-whisper and Drive client
        run: python -m pip install --upgrade pip && python -m pip install faster-whisper google-auth requests

      - name: Write service account key
        env:
          SA_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$SA_KEY" ]; then echo "GOOGLE_SERVICE_ACCOUNT_KEY secret is not set" >&2; exit 1; fi
          printf '%s' "$SA_KEY" > service-account.json
          python3 -c "import json; json.load(open('service-account.json')); print('service account key parses OK')"

      - name: Render
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          printf '%s' "$MANIFEST_JSON" > manifest.json
          python3 render.py --mode "${{ inputs.mode }}" --manifest manifest.json \
            --video-id "${{ inputs.video_id }}" \
            --drive-key service-account.json \
            --drive-folder "${{ inputs.drive_folder }}" > render-summary.json
          cat render-summary.json

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_id }}
          path: |
            out/${{ inputs.video_id }}.mp4
            out/${{ inputs.video_id }}-captioned.mp4
            render-summary.json
          if-no-files-found: error
          retention-days: 7
