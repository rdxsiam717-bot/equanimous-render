# Equanimous voiceover — Chatterbox Nano (main) with Kokoro fallback.
#
# Generates a narration MP3 for a video script. The main provider is
# Chatterbox Nano (Resemble AI, MIT licence, commercial-safe): it clones a
# short reference recording of a real voice (5-10 s) and is the more
# expressive, humanlike narrator. If Chatterbox fails (or no reference is
# given), the workflow falls back to Kokoro (Apache 2.0) with a fixed
# preset voice. The provider actually used is recorded in the summary JSON.
#
# Runs entirely on GitHub's runners: nothing is installed on any device or
# server. The runner installs CPU torch + chatterbox-tts + kokoro-onnx,
# downloads the models (cached between runs), synthesizes the audio, and
# uploads the MP3 as a workflow artifact.
#
# Triggered by n8n (W03) or from the GitHub Pages voice site via
# workflow_dispatch, same as the render and voiceover workflows.
#
# Inputs:
#   run_id       - e.g. vo-20261113-0930; also the artifact name
#   text         - script text to narrate (plain text, ~110-140 words)
#   reference    - path in the repo to the voice-clone reference audio,
#                  e.g. references/my-voice.wav (5-10 s). Empty = Kokoro only.
#   speed        - Kokoro speaking speed, 1.0 is normal (Chatterbox has no
#                  speed control; ignored when Chatterbox renders)
#   provider     - auto (Chatterbox Nano first, Kokoro on failure),
#                  chatterbox (Nano only, fails if it cannot render),
#                  kokoro (Kokoro only)
#   kokoro_voice - Kokoro fallback voice, e.g. bm_daniel (British male)
#   kokoro_lang  - en-gb for British voices, en-us for American
#
# No secrets needed: both models are public, no API key required.
# Chatterbox is retired/unmaintained since Aug 2026; it is installed from
# the frozen GitHub master (PyPI 0.1.7 predates the `nano` parameter).

name: Equanimous Chatterbox voiceover

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id, e.g. vo-20261113-0930 (also the artifact name)"
        required: true
        type: string
      text:
        description: "Script text to narrate"
        required: true
        type: string
      reference:
        description: "Voice-clone reference in the repo, e.g. references/reference-clarke.wav (empty = Kokoro only)"
        required: false
        type: string
        default: "references/reference-clarke.wav"
      speed:
        description: "Kokoro speaking speed, 1.0 is normal"
        required: false
        type: string
        default: "0.9"
      provider:
        description: "auto = Chatterbox Nano first, Kokoro on failure; chatterbox = Nano only; kokoro = Kokoro only"
        required: false
        type: string
        default: "auto"
      kokoro_voice:
        description: "Kokoro fallback voice, e.g. bm_daniel (British male)"
        required: false
        type: string
        default: "bm_daniel"
      kokoro_lang:
        description: "Language code: en-gb for British voices, en-us for American"
        required: false
        type: string
        default: "en-gb"

permissions:
  contents: read

jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and espeak-ng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          ffmpeg -version | head -1

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: kokoro-models
          key: kokoro-v1.0-onnx

      - name: Install CPU torch first (avoid CUDA build)
        run: pip install "torch==2.6.0" "torchaudio==2.6.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install Chatterbox from GitHub master and Kokoro
        # PyPI's latest chatterbox-tts (0.1.7) predates the `nano`
        # parameter — Nano support exists only on master. The repo is
        # retired (Aug 2026), so master is the final frozen state.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git" kokoro-onnx soundfile numpy
          python -m pip install "misaki[en]" || echo "misaki install failed, falling back to espeak-ng"

      - name: Download Kokoro model files (if not cached)
        run: |
          mkdir -p kokoro-models
          cd kokoro-models
          [ -f kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          ls -la

      - name: Generate voiceover
        env:
          VOICEOVER_TEXT: ${{ inputs.text }}
        run: |
          printf '%s' "$VOICEOVER_TEXT" > script.txt
          python3 chatterbox-voiceover.py --text-file script.txt \
            --reference "${{ inputs.reference }}" \
            --speed "${{ inputs.speed }}" \
            --provider "${{ inputs.provider }}" \
            --kokoro-voice "${{ inputs.kokoro_voice }}" \
            --kokoro-lang "${{ inputs.kokoro_lang }}" \
            --model kokoro-models/kokoro-v1.0.onnx \
            --voices kokoro-models/voices-v1.0.bin \
            --video-id "${{ inputs.run_id }}" > voiceover-summary.json
          cat voiceover-summary.json

      - name: Upload voiceover
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.run_id }}-voiceover
          path: |
            out/${{ inputs.run_id }}-voiceover.mp3
            voiceover-summary.json
          if-no-files-found: error
          retention-days: 7
