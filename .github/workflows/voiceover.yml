# Equanimous voiceover — Kokoro TTS on GitHub Actions.
#
# Generates a narration MP3 for a video script using Kokoro (Apache 2.0,
# free for commercial use). Runs entirely on GitHub's runners: nothing is
# installed on any device or server. The runner installs kokoro-onnx,
# downloads the model files (cached between runs), synthesizes the audio
# with the requested voice, and uploads the MP3 as a workflow artifact.
#
# Triggered by n8n (W03) via workflow_dispatch, same as the render workflow.
#
# Inputs:
#   video_id - e.g. EQ-1794354039014-0; also the artifact name
#   text     - script text to narrate (plain text, ~110-140 words)
#   voice    - Kokoro voice, e.g. bm_daniel (British male, the approved
#              Equanimous narrator). am_ = American male, af_ = American
#              female, bf_ = British female.
#   lang     - language code: en-gb for British voices, en-us for American
#   speed    - speaking speed, 1.0 is normal
#
# No secrets needed: the Kokoro model is public on Hugging Face / GitHub
# releases, no API key required.

name: Equanimous voiceover

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video id, e.g. EQ-1794354039014-0 (also the artifact name)"
        required: true
        type: string
      text:
        description: "Script text to narrate"
        required: true
        type: string
      voice:
        description: "Kokoro voice, e.g. bm_daniel (British male)"
        required: false
        type: string
        default: "bm_daniel"
      lang:
        description: "Language code: en-gb for British voices, en-us for American"
        required: false
        type: string
        default: "en-gb"
      speed:
        description: "Speaking speed, 1.0 is normal"
        required: false
        type: string
        default: "1.0"

permissions:
  contents: read

jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and espeak-ng
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          ffmpeg -version | head -1

      - name: Cache Kokoro model files
        uses: actions/cache@v4
        with:
          path: kokoro-models
          key: kokoro-v1.0-onnx

      - name: Install kokoro-onnx
        run: |
          python -m pip install --upgrade pip
          python -m pip install kokoro-onnx soundfile numpy
          python -m pip install "misaki[en]" || echo "misaki install failed, falling back to espeak-ng"

      - name: Download Kokoro model files (if not cached)
        run: |
          mkdir -p kokoro-models
          cd kokoro-models
          [ -f kokoro-v1.0.onnx ] || curl -fsSL -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          [ -f voices-v1.0.bin ] || curl -fsSL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          ls -la

      - name: Generate voiceover
        env:
          VOICEOVER_TEXT: ${{ inputs.text }}
        run: |
          printf '%s' "$VOICEOVER_TEXT" > script.txt
          python3 voiceover.py --text-file script.txt \
            --voice "${{ inputs.voice }}" --lang "${{ inputs.lang }}" \
            --speed "${{ inputs.speed }}" \
            --model kokoro-models/kokoro-v1.0.onnx \
            --voices kokoro-models/voices-v1.0.bin \
            --video-id "${{ inputs.video_id }}" > voiceover-summary.json
          cat voiceover-summary.json

      - name: Upload voiceover
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_id }}-voiceover
          path: |
            out/${{ inputs.video_id }}-voiceover.mp3
            voiceover-summary.json
          if-no-files-found: error
          retention-days: 7
